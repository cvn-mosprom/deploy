---
- name: Prepare runtime catalogue and run one migration
  hosts: mosprom
  become: true
  any_errors_fatal: true
  tasks:
    - name: Require inventory and a complete immutable release
      ansible.builtin.assert:
        that:
          - release_manifest.images | length == 4
          - environment in ['staging', 'production']
          - not ansible_host.startswith('203.0.113.')
    - name: Create immutable configuration directory
      ansible.builtin.file:
        path: '/opt/mosprom/{{ release_manifest.deploySha }}'
        state: directory
        mode: '0755'
    - name: Render approved configuration archive and candidate metadata
      ansible.builtin.unarchive:
        src: '{{ deployment_archive }}'
        dest: '/opt/mosprom/{{ release_manifest.deploySha }}/'
    - name: Copy image manifest variables
      ansible.builtin.copy:
        src: '{{ rendered_images }}'
        dest: '/srv/mosprom-{{ environment }}/candidate.env'
        mode: '0600'
    - name: Check total backend connection budget
      ansible.builtin.assert:
        that:
          - (groups.mosprom | length) * (pgbouncer_pool_size | default(20) | int) + 30 <= (postgres_max_connections | default(200) | int)
          - (api_workers | default(2) | int) > 0
          - (sim_workers | default(2) | int) > 0
          - (sim_workers | default(2) | int) <= 256
    - name: Determine PostgreSQL primary
      ansible.builtin.uri:
        url: 'https://{{ wg_ip }}:8008/primary'
        client_cert: '/srv/mosprom-{{ environment }}/tls/patroni.crt'
        client_key: '/srv/mosprom-{{ environment }}/tls/patroni.key'
        ca_path: '/srv/mosprom-{{ environment }}/tls/ca.crt'
        status_code: [200, 503]
      register: patroni_role
      retries: 30
      delay: 2
      until: patroni_role.status is defined
    - name: Back up before migrations, on the primary only
      ansible.builtin.command:
        argv: [docker, compose, --env-file, '/srv/mosprom-{{ environment }}/images.env', -f, '/srv/mosprom-{{ environment }}/ha/compose.yml', exec, -T, patroni, pgbackrest, --stanza=mosprom, --type=incr, backup]
      when: patroni_role.status == 200
      changed_when: true
    - name: Apply migrations exactly once through the direct primary endpoint
      ansible.builtin.command:
        argv: [docker, compose, --env-file, '/srv/mosprom-{{ environment }}/.env', --env-file, '/srv/mosprom-{{ environment }}/candidate.env', -f, '/opt/mosprom/{{ release_manifest.deploySha }}/compose/compose.yml', -f, '/opt/mosprom/{{ release_manifest.deploySha }}/compose/ha.yml', run, --rm, migrate]
      run_once: true
      changed_when: true

- name: Update application nodes one at a time
  hosts: mosprom
  serial: 1
  become: true
  any_errors_fatal: true
  tasks:
    - name: Drain this region from every discovery instance
      ansible.builtin.command:
        argv: [python3, '/opt/mosprom/{{ release_manifest.deploySha }}/scripts/catalogue.py', '/srv/mosprom-{{ environment }}/routing/regions.json', --drain, '{{ region_id }}']
      delegate_to: '{{ item }}'
      loop: '{{ groups.mosprom }}'
      changed_when: true
    - name: Wait for catalogue TTL and in-flight HTTP requests
      ansible.builtin.pause:
        seconds: 65
    - name: Pull and start the reviewed images
      block:
        - name: Pull immutable application images
          ansible.builtin.command:
            argv: [docker, compose, --env-file, '/srv/mosprom-{{ environment }}/.env', --env-file, '/srv/mosprom-{{ environment }}/candidate.env', -f, '/opt/mosprom/{{ release_manifest.deploySha }}/compose/compose.yml', -f, '/opt/mosprom/{{ release_manifest.deploySha }}/compose/ha.yml', pull]
          changed_when: true
        - name: Start application services
          ansible.builtin.command:
            argv: [docker, compose, --env-file, '/srv/mosprom-{{ environment }}/.env', --env-file, '/srv/mosprom-{{ environment }}/candidate.env', -f, '/opt/mosprom/{{ release_manifest.deploySha }}/compose/compose.yml', -f, '/opt/mosprom/{{ release_manifest.deploySha }}/compose/ha.yml', up, -d, --wait, --wait-timeout, '180', --scale, 'api={{ api_replicas | default(1) }}', --scale, 'sim={{ sim_replicas | default(1) }}']
          changed_when: true
        - name: Verify regional readiness
          ansible.builtin.uri:
            url: '{{ readiness_url }}'
            status_code: 200
          register: readiness
          retries: 30
          delay: 2
          until: readiness.status == 200
        - name: Admit updated region with its actual release identity
          ansible.builtin.command:
            argv: [python3, '/opt/mosprom/{{ release_manifest.deploySha }}/scripts/catalogue.py', '/srv/mosprom-{{ environment }}/routing/regions.json', --activate, '{{ region_id }}', --release, '{{ release_manifest.releaseId }}', --frontend, '{{ release_manifest.frontendSha }}']
          delegate_to: '{{ item }}'
          loop: '{{ groups.mosprom }}'
          changed_when: true
        - name: Persist successful manifest and image selection
          ansible.builtin.copy:
            src: '{{ manifest_path }}'
            dest: '/srv/mosprom-{{ environment }}/current.json'
            mode: '0600'
      rescue:
        - name: Leave failing region drained and require controlled recovery
          ansible.builtin.fail:
            msg: 'Rollout stopped; failed region remains drained. Restore previous compatible images using RUNBOOK; database restore is never automatic.'
    - name: Activate configuration pointer and image variables
      ansible.builtin.file:
        src: '/opt/mosprom/{{ release_manifest.deploySha }}'
        dest: '/srv/mosprom-{{ environment }}/current-config'
        state: link
        force: true
    - name: Persist current image variables
      ansible.builtin.copy:
        remote_src: true
        src: '/srv/mosprom-{{ environment }}/candidate.env'
        dest: '/srv/mosprom-{{ environment }}/images.env'
        mode: '0600'
    - name: Install resource and backup timers
      ansible.builtin.copy:
        src: '{{ playbook_dir }}/../systemd/{{ item }}'
        dest: '/etc/systemd/system/{{ item }}'
        mode: '0644'
      loop: [mosprom-metrics@.service, mosprom-metrics@.timer, mosprom-ha-backup@.service, mosprom-ha-backup@.timer, mosprom-ha-full-backup@.service, mosprom-ha-full-backup@.timer]
    - name: Enable scheduled resource collection and backups
      ansible.builtin.systemd_service:
        name: '{{ item }}@{{ environment }}.timer'
        daemon_reload: true
        enabled: true
        state: started
      loop: [mosprom-metrics, mosprom-ha-backup, mosprom-ha-full-backup]

---
- name: Prepare Linux hosts and encrypted mesh
  hosts: mosprom
  become: true
  any_errors_fatal: true
  tasks:
    - name: Require inventory, vaulted credentials and real addresses
      ansible.builtin.assert:
        that:
          - deployment_environment in ['staging', 'production']
          - not ansible_host.startswith('203.0.113.')
          - vault_wireguard_private_key is defined
          - vault_wireguard_public_keys is defined
          - vault_tls_files is defined
          - vault_app_password is match('^[A-Za-z0-9]{32,}$')
          - vault_migration_password is match('^[A-Za-z0-9]{32,}$')
          - vault_replication_password is match('^[A-Za-z0-9]{32,}$')
          - vault_redis_password is match('^[A-Za-z0-9]{32,}$')
          - vault_pgbackrest_cipher is defined
          - release_manifest is defined
          - vault_alert_webhook_url is match('https://.+')
          - vault_alert_webhook_token is defined
      no_log: true
    - name: Install host packages
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2, wireguard, python3, python3-yaml, restic, ufw, chrony]
        state: present
        update_cache: true
    - name: Start Docker and clock synchronization
      ansible.builtin.service:
        name: '{{ item }}'
        state: started
        enabled: true
      loop: [docker, chrony]
    - name: Create shared TLS group
      ansible.builtin.group:
        name: mosprom-tls
        gid: 20000
    - name: Create state directories
      ansible.builtin.file:
        path: '/srv/mosprom-{{ deployment_environment }}/{{ item }}'
        state: directory
        mode: '0750'
        group: mosprom-tls
      loop: [tls, ha, backups, releases, caddy, sentinel, routing, monitoring]
    - name: Provision certificates with restricted group access
      ansible.builtin.copy:
        content: '{{ item.value }}'
        dest: '/srv/mosprom-{{ deployment_environment }}/tls/{{ item.key }}'
        owner: root
        group: mosprom-tls
        mode: '0640'
      loop: '{{ vault_tls_files | dict2items }}'
      no_log: true
    - name: Render WireGuard full mesh
      ansible.builtin.template:
        src: wg0.conf.j2
        dest: /etc/wireguard/wg0.conf
        mode: '0600'
      no_log: true
      notify: Restart WireGuard
    - name: Enable WireGuard
      ansible.builtin.service:
        name: wg-quick@wg0
        enabled: true
        state: started
    - name: Allow SSH HTTPS and WireGuard
      ansible.builtin.command:
        argv: [ufw, allow, '{{ item }}']
      loop: ['22/tcp', '80/tcp', '443/tcp', '{{ wireguard_port }}/udp']
      changed_when: false
    - name: Allow private mesh
      ansible.builtin.command: ufw allow in on wg0
      changed_when: false
    - name: Permit container traffic only to private cluster endpoints
      ansible.builtin.command: ufw allow from 172.16.0.0/12 to {{ wg_ip }}
      changed_when: false
    - name: Enable firewall
      ansible.builtin.command: ufw --force enable
      changed_when: false
    - name: Enable watchdog module for Patroni fencing
      ansible.builtin.copy:
        dest: /etc/modules-load.d/mosprom-watchdog.conf
        content: |
          softdog
        mode: '0644'
    - name: Load watchdog
      ansible.builtin.command: modprobe softdog
      changed_when: false
    - name: Restrict watchdog device to PostgreSQL UID
      ansible.builtin.file:
        path: /dev/watchdog
        owner: '999'
        mode: '0600'
    - name: Create versioned configuration directory
      ansible.builtin.file:
        path: '/opt/mosprom/{{ release_manifest.deploySha }}'
        state: directory
        mode: '0755'
    - name: Unpack reviewed versioned deployment archive
      ansible.builtin.unarchive:
        src: '{{ deployment_archive }}'
        dest: '/opt/mosprom/{{ release_manifest.deploySha }}/'
    - name: Initialize public catalogue without overwriting an existing rolling state
      ansible.builtin.copy:
        src: '{{ runtime_directory }}/routing/regions.json'
        dest: '/srv/mosprom-{{ deployment_environment }}/routing/regions.json'
        mode: '0640'
        group: mosprom-tls
        force: false
    - name: Install private monitoring targets
      ansible.builtin.copy:
        src: '{{ runtime_directory }}/prometheus-targets.json'
        dest: '/srv/mosprom-{{ deployment_environment }}/prometheus-targets.json'
        mode: '0640'
        group: mosprom-tls
    - name: Provision Alertmanager receiver
      ansible.builtin.template:
        src: alertmanager.yml.j2
        dest: '/srv/mosprom-{{ deployment_environment }}/alertmanager.yml'
        mode: '0640'
        group: mosprom-tls
      no_log: true
    - name: Provision receiver token
      ansible.builtin.copy:
        content: '{{ vault_alert_webhook_token }}'
        dest: '/srv/mosprom-{{ deployment_environment }}/alert-webhook-token'
        mode: '0640'
        group: mosprom-tls
      no_log: true
    - name: Render HA services
      ansible.builtin.template:
        src: '{{ item }}.j2'
        dest: '/srv/mosprom-{{ deployment_environment }}/ha/{{ item }}'
        mode: '0640'
        group: mosprom-tls
      loop: [compose.yml, patroni.yml, haproxy.cfg, pgbouncer.ini, redis.conf, sentinel.conf, pgbackrest.conf]
      no_log: true
    - name: Initialize Sentinel writable configuration only once
      ansible.builtin.copy:
        remote_src: true
        src: '/srv/mosprom-{{ deployment_environment }}/ha/sentinel.conf'
        dest: '/srv/mosprom-{{ deployment_environment }}/sentinel/sentinel.conf'
        force: false
        mode: '0600'
      when: inventory_hostname in groups['redis_nodes']
      no_log: true
    - name: Render runtime deployment_environment
      ansible.builtin.template:
        src: runtime.env.j2
        dest: '/srv/mosprom-{{ deployment_environment }}/.env'
        mode: '0600'
      no_log: true
    - name: Write immutable image variables and manifest
      ansible.builtin.copy:
        src: '{{ item.src }}'
        dest: '/srv/mosprom-{{ deployment_environment }}/{{ item.dest }}'
        mode: '0600'
      loop:
        - {src: '{{ rendered_images }}', dest: images.env}
        - {src: '{{ manifest_path }}', dest: candidate.json}
    - name: Create PostgreSQL data directory
      ansible.builtin.file:
        path: '/srv/mosprom-{{ deployment_environment }}/postgres'
        state: directory
        owner: '999'
        group: '999'
        mode: '0700'
    - name: Create writable data directory for the unprivileged DCS
      ansible.builtin.file:
        path: '/srv/mosprom-{{ deployment_environment }}/etcd'
        state: directory
        owner: '10005'
        group: '10005'
        mode: '0700'
      when: inventory_hostname in groups['dcs']
    - name: Start quorum before database bootstrap
      ansible.builtin.command:
        argv: [docker, compose, --env-file, '/srv/mosprom-{{ deployment_environment }}/images.env', -f, '/srv/mosprom-{{ deployment_environment }}/ha/compose.yml', up, -d, etcd]
      when: inventory_hostname in groups['dcs']
      changed_when: true
  handlers:
    - name: Restart WireGuard
      ansible.builtin.service:
        name: wg-quick@wg0
        state: restarted

- name: Initialize etcd authentication and roles before Patroni
  hosts: dcs[0]
  become: true
  tasks:
    - name: Provision least-privilege etcd identities
      ansible.builtin.script:
        cmd: '../scripts/etcd_auth.sh /srv/mosprom-{{ deployment_environment }} {{ deployment_environment }}'
      no_log: true

- name: Start replicated stateful services
  hosts: mosprom
  become: true
  tasks:
    - name: Start Patroni PgBouncer and Redis services
      ansible.builtin.command:
        argv: [docker, compose, --env-file, '/srv/mosprom-{{ deployment_environment }}/images.env', -f, '/srv/mosprom-{{ deployment_environment }}/ha/compose.yml', up, -d]
      changed_when: true
    - name: Wait for one elected PostgreSQL primary
      ansible.builtin.command:
        argv: [docker, compose, --env-file, '/srv/mosprom-{{ deployment_environment }}/images.env', -f, '/srv/mosprom-{{ deployment_environment }}/ha/compose.yml', exec, -T, patroni, /opt/patroni/bin/patronictl, -c, /etc/patroni.yml, list, --format, json]
      register: cluster_members
      run_once: true
      retries: 60
      delay: 2
      until: cluster_members.rc == 0 and (cluster_members.stdout | from_json | selectattr('Role', 'equalto', 'Leader') | list | length) == 1
      changed_when: false
    - name: Create restricted database roles on the primary
      ansible.builtin.command:
        argv: [docker, compose, --env-file, '/srv/mosprom-{{ deployment_environment }}/images.env', -f, '/srv/mosprom-{{ deployment_environment }}/ha/compose.yml', exec, -T, patroni, psql, -v, ON_ERROR_STOP=1, -U, postgres, -d, postgres]
        stdin: "{{ lookup('template', 'templates/roles.sql.j2') }}"
      delegate_to: "{{ (cluster_members.stdout | from_json | selectattr('Role', 'equalto', 'Leader') | first)['Member'] }}"
      run_once: true
      no_log: true
      changed_when: true
    - name: Initialize encrypted backup stanza on the primary
      ansible.builtin.command:
        argv: [docker, compose, --env-file, '/srv/mosprom-{{ deployment_environment }}/images.env', -f, '/srv/mosprom-{{ deployment_environment }}/ha/compose.yml', exec, -T, patroni, pgbackrest, --stanza=mosprom, stanza-create]
      delegate_to: "{{ (cluster_members.stdout | from_json | selectattr('Role', 'equalto', 'Leader') | first)['Member'] }}"
      run_once: true
      changed_when: true

global
  log stdout format raw local0
defaults
  mode http
  timeout connect 1s
  timeout client 5s
  timeout server 4s
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  hold valid 5s
frontend sim
  bind :8080
  default_backend simulations
backend simulations
  balance leastconn
  option httpchk GET /health
  http-check expect status 200
  server-template sim 1-32 sim:8080 check resolvers docker init-addr libc,none

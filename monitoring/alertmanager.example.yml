global:
  resolve_timeout: 5m
route:
  receiver: operations
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: operations
    webhook_configs:
      - url: https://alerts.example.com/mosprom
        send_resolved: true
        http_config:
          authorization:
            credentials_file: /run/secrets/alert-webhook-token

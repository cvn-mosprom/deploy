name: recovery
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0'
permissions: {contents: read, packages: read}
concurrency: {group: staging-recovery, cancel-in-progress: false}
jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    environment: staging
    runs-on: [self-hosted, mosprom-cd]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Restore isolated staging backup and verify application readiness
        env: {DEPLOYMENT_TOPOLOGY: '${{ vars.DEPLOYMENT_TOPOLOGY }}'}
        run: |
          if [ "$DEPLOYMENT_TOPOLOGY" = ha ]; then
            python3 scripts/restore_ha.py /srv/mosprom-staging --output restore-results.json
          else
            python3 scripts/recovery_single.py /srv/mosprom-staging
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: recovery-results, path: restore-results.json, retention-days: 30}

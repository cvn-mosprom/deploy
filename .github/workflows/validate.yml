name: validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read, packages: read}
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12'}
      - run: pip install --require-hashes -r requirements.lock
      - run: python scripts/validate.py
      - run: pytest -q
      - run: ruff check --select E9,F63,F7,F82 scripts services
      - run: bandit -r scripts services -ll
      - run: ansible-playbook -i ansible/inventory.example.yml ansible/site.yml --syntax-check
      - run: ansible-playbook -i ansible/inventory.example.yml ansible/rollout.yml --syntax-check
      - run: python scripts/check_templates.py
      - run: python scripts/check_compose.py
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Validate signatures of every candidate release
        run: |
          for manifest in releases/*.json; do
            test -f "$manifest" || continue
            python scripts/release.py "$manifest" --verify
          done

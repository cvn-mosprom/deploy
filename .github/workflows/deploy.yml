name: deploy
on:
  push:
    branches: [main]
    paths: ['releases/*.json']
  workflow_dispatch:
    inputs:
      release:
        description: Release ID already validated on staging
        type: string
        required: true
      environment:
        type: choice
        options: [staging, production]
        default: production
permissions: {contents: read, packages: read, deployments: write}
concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false
jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.select.outputs.release }}
      environment: ${{ steps.select.outputs.environment }}
      deploy-sha: ${{ steps.select.outputs.deploy-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 2, persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - id: select
        env:
          REQUESTED_RELEASE: ${{ inputs.release }}
          TARGET_ENVIRONMENT: ${{ inputs.environment || 'staging' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/select_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: selected-release, path: selected.json, retention-days: 14}
  rollout:
    needs: select
    environment: ${{ needs.select.outputs.environment }}
    # Runner group must allow this workflow on main only, never PR workflows.
    runs-on: [self-hosted, mosprom-cd]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ needs.select.outputs.deploy-sha }}', persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: selected-release, path: .selected}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Serialized deployment of the exact release
        env:
          TARGET_ENVIRONMENT: ${{ needs.select.outputs.environment }}
          RELEASE_ID: ${{ needs.select.outputs.release }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_TOPOLOGY: ${{ vars.DEPLOYMENT_TOPOLOGY }}
        run: bash scripts/cd.sh .selected/selected.json
